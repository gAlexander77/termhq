<svg xmlns="http://www.w3.org/2000/svg" viewBox="97 161 835 703" role="img" aria-label="TermHQ">
  <title>TermHQ</title>
  <!--
    The viewBox is the artwork's bounding box, not the 1024 icon canvas: the
    window rect spans 123..906 with a 52 stroke centerd on it, so the ink runs
    97..932 by 161..864. Cropping to it means the mark has no built-in margin —
    whatever places it decides its own spacing, instead of inheriting 16% of
    empty space that only made sense inside an app-icon tile. Coordinates are
    unchanged from the icon, so this stays comparable to icons/icon.png.
  -->
  <!--
    The TermHQ mark: a terminal window with a prompt, a cursor and a smile.
    Redrawn as vector from the 1024px raster icon by measuring the artwork
    rather than tracing it by eye — the window border and chevron share a
    52-unit stroke, the smile is 42, and the smile's arc is fitted through its
    two measured endpoints and its lowest point.

    fill/stroke are currentColor on purpose: the mark is monochrome, so it
    inherits whatever color it is placed in (a themed titlebar, a dark or
    light page) instead of hard-coding white.
  -->
  <g fill="none" stroke="currentColor" stroke-width="52">
    <!-- terminal window; rx is the centerline radius, 100 = 126 outer - 26 half-stroke -->
    <rect x="123" y="187" width="783" height="651" rx="100" />
    <!-- The smile is a Bézier, not an arc: measured widths across it fit no
         single radius (a circle through its ends is far too round at the
         bottom), so the original is flatter in the middle than any arc. -->
    <path d="M395 651 C 421 733 610 733 636 651" stroke-width="42" />
  </g>
  <!-- Prompt chevron, a filled polygon rather than a stroked polyline: its arm
       ends are cut vertically instead of perpendicular to the stroke, and its
       tip is flat, not pointed — the original holds x=475 across y 460..480.
       Neither is expressible with stroke caps and joins. -->
  <path fill="currentColor"
        d="M291 326 L475 452 L475 488 L291 618 L291 554 L402 470 L291 396 Z" />
  <!-- cursor block, square corners -->
  <rect x="661" y="354" width="68" height="226" fill="currentColor" />
</svg>
